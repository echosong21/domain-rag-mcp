# 工具注册表 —— 唯一事实源
#
# 加一个工具 = 这里加一段 + 新建一个 py 文件。核心代码不动。
#
# `scope` 是权限单位：profile 通过「授予 scope」获得工具。
# `fallback` 是降级链：只允许**同权限域内**（common.* 只能降到 common.*）。
# `requires` 用于 health_check 报告降级，也用于熔断器分区。
version: 1

# 已知权限域。每个工具必须声明自己属于哪个；未声明的 scope 会让启动失败。
scopes:
  - common.discovery
  - common.knowledge
  - common.safety
  - common.ops.read
  - common.ops.write
  - dev.eval
  - dev.feedback

tools:
  # ── 第 1 个：领域发现 ─────────────────────────────────────
  - name: common.discovery.list_domains
    module: tools.common.discovery.list_domains
    handler: list_domains
    brief: 列出可用的知识领域，含每种的检索形态与集合名
    scope: common.discovery
    tags: [领域, 列表, domain, list, discover, 发现]
    side_effect: read
    batch: core

  # ── 第 2 个：依赖探活 ─────────────────────────────────────
  #
  # 这个工具必须存在，理由见 health_check.py 的模块 docstring：
  # 没有它，Agent 只能靠「调用超时」发现后端不可用。
  - name: common.discovery.health_check
    module: tools.common.discovery.health_check
    handler: health_check
    brief: 检查向量库 / embedding / 重排服务与熔断器的当前状态
    scope: common.discovery
    tags: [健康, 探活, 状态, health, status, check, probe]
    side_effect: read
    requires: [milvus, embedding]
    batch: core

  # ── 检索：单路向量召回 ────────────────────────────────────
  #
  # ⚠️ `common.knowledge` 这个 scope 长期是空的 —— 一个 RAG 服务没有「检索」工具
  #    是明显缺口。它补的就是这个洞。
  #
  # ⚠️ 它**不生成回答**：只返回带来源的片段。生成要另开工具，因为生成贵得多
  #    （实测同一链路上检索约 350ms、生成可达 16 秒），
  #    只做检索就能满足需求的调用方不该被迫付生成的钱。
  - name: common.knowledge.search
    module: tools.common.knowledge
    handler: search
    brief: 在指定领域做单路向量检索，返回带来源的片段列表（不生成回答）
    scope: common.knowledge
    tags: [检索, 召回, 搜索, search, retrieve, recall, vector, 片段, chunk]
    side_effect: read
    requires: [milvus, embedding]
    batch: core

  # ── 检索：多形态并发 + RRF 融合 ──────────────────────────
  #
  # 解决「答案在表格，问法像问答」这类跨形态漏召回。
  #
  # ⚠️ 它的 `score` 是 RRF 融合分（典型 0.01–0.05），**不是向量相似度**。
  #    所以它刻意不提供 min_score 参数 —— 拿相似度阈值过滤 RRF 分会得到空结果，
  #    而且这种错很难看出来（工具返回 0 条，看起来像"确实没有"）。
  - name: common.knowledge.search_multi
    module: tools.common.knowledge
    handler: search_multi
    brief: 按数据形态并发召回多路再 RRF 融合，返回统一排序的片段列表（不生成回答）
    scope: common.knowledge
    tags: [多路, 融合, 并发, multi, fuse, rrf, hybrid, 形态, form]
    side_effect: read
    requires: [milvus, embedding]
    batch: core

  # ── 运维：索引状态（只读）────────────────────────────────
  - name: common.ops.get_index_status
    module: tools.common.ops
    handler: get_index_status
    brief: 查询某集合的行数、索引类型与状态
    scope: common.ops.read
    tags: [索引, 状态, 行数, index, status, rows, collection]
    side_effect: read
    requires: [milvus]
    batch: core

  # ── 运维：重建索引（唯一写工具）──────────────────────────
  #
  # ⚠️ 三重限制：需 common.ops.write（health-agent 没有）/ 默认 dry_run /
  # 写工具不允许配 fallback（registry 加载期强制）。
  - name: common.ops.reindex
    module: tools.common.ops
    handler: reindex
    brief: 重建某领域的索引；默认只预演，需显式传 dry_run=false 才真的执行
    scope: common.ops.write
    tags: [重建, 索引, 建库, reindex, rebuild, index]
    side_effect: write
    requires: [milvus, embedding]
    batch: core

  # ── 安全：规则透明化 ─────────────────────────────────────
  - name: common.safety.get_rules
    module: tools.common.safety
    handler: get_rules
    brief: 返回该领域的禁止断言、免责声明、计划变动上限与急症信号
    scope: common.safety
    tags: [安全, 规则, 边界, safety, rules, policy]
    side_effect: read
    batch: core

  # ── 安全：输入闸 ─────────────────────────────────────────
  - name: common.safety.check_input
    module: tools.common.safety
    handler: check_input
    brief: 检查用户输入是否需转介急症，或触及禁止断言
    scope: common.safety
    tags: [安全, 输入, 急症, 转介, safety, input, check]
    side_effect: read
    batch: core

  # ── 安全：输出闸 ─────────────────────────────────────────
  #
  # 命中禁止断言时**整条拒答、不改写** —— 改写等于把不安全内容重新交给模型生成。
  - name: common.safety.check_output
    module: tools.common.safety
    handler: check_output
    brief: 检查生成的回答是否含禁止断言；命中则整条拒答（不改写）
    scope: common.safety
    tags: [安全, 输出, 断言, safety, output, check, guard]
    side_effect: read
    batch: core

# ── Step 1 未配置的部分（Step 4–6 逐批加）─────────────────
